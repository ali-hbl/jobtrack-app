<div class="add-card-container">
  <form [formGroup]="newCardForm" (ngSubmit)="addCard()" class="card-form">
    <div class="input-group">
      <input type="text" formControlName="company" placeholder="Nom de l'entreprise (ex: Apple)" />

      <!-- affiche une erreur si le champ a été touché mais est vide -->
      @if (newCardForm.get('company')?.invalid && newCardForm.get('company')?.touched) {
        <span class="error">Obligatoire</span>
      }
    </div>

    <div class="input-group">
      <input type="text" formControlName="role" placeholder="Poste (ex: Dev Fullstack)" />
    </div>

    <!-- Le bouton se désactive tout seul si le formulaire n'est pas valide ! -->
    <button type="submit" [disabled]="newCardForm.invalid">Ajouter</button>
  </form>
</div>

<!-- Ta div .board reste en dessous -->
<div class="board" cdkDropListGroup>
  ...

  <!-- cdkDropListGroup permet aux colonnes de communiquer entre elles -->
  <div class="board" cdkDropListGroup>
    <!-- Boucle sur le signal board() pour afficher les colonnes -->
    @for (column of board(); track column.id) {
      <div class="column">
        <h2>{{ column.title }}</h2>

        <!-- La zone où on peut lâcher les cartes -->
        <div
          class="card-list"
          cdkDropList
          [cdkDropListData]="column.cards"
          (cdkDropListDropped)="drop($event)"
        >
          <!-- On boucle sur les cartes de la colonne -->
          @for (card of column.cards; track card.id) {
            <!-- cdkDrag rend la carte "saisissable" avec la souris -->
            <div class="card" cdkDrag>
              <strong>{{ card.company }}</strong>
              <p>{{ card.role }}</p>
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>
